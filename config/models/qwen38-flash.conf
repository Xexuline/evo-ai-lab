# Qwen3.8 Flash Next - ROCm 10 + strix-llama
# Launch with: evo-model start agent qwen38-flash
PROFILE_NAME=qwen38-flash

MODEL_PATH=/home/evo/models/Qwen38Flash/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf

BACKEND=ROCm
CONTAINER=llama-rocm-strix
RUNTIME_CONTAINER=llama-rocm-strix

SERVER_PATH=/usr/local/bin/llama-server

CONTEXT_SIZE=524288
GPU_LAYERS=99
PARALLEL_SLOTS=3

FLASH_ATTN=on
BATCH_SIZE=2048
UBATCH_SIZE=512

CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0

LAZY_MODE=off

JINJA=on
REASONING=on
REASONING_PRESERVE=on

SPEC_TYPE=draft-mtp
DRAFT_MODEL_PATH=/home/evo/models/Qwen38Flash/MTP-agentionai/Qwen3.8-Flash-Next-MTP-Q8_0.gguf
SPEC_DRAFT_N_MAX=3

HOST=0.0.0.0
PORT=8081

# Testing config
HIP_LAUNCH_BLOCKING=1
SPEC_DRAFT_ADAPTIVE=on
