# Uses the strix-llama.cpp build inside llama-vulkan-worker.
# evo-model runs inside Distrobox, not directly on the host.
# PORT records the original command; evo-model overrides it with the instance
# port: worker=8080, agent=8081. It does not currently launch on 8082.
PROFILE_NAME=qwen35-9b
MODEL_PATH=/home/evo/models/Qwen3.5/Qwen3.5-9B-MTP-Q4_K_M.gguf
BACKEND=Vulkan
CONTAINER=llama-vulkan-worker
RUNTIME_CONTAINER=llama-vulkan-worker
SERVER_PATH=/home/evo/strix-llama.cpp/build/bin/llama-server
CONTEXT_SIZE=98304
GPU_LAYERS=99
PARALLEL_SLOTS=2
FLASH_ATTN=on
CACHE_TYPE_K=q8_0
CACHE_TYPE_V=q8_0
SPEC_TYPE=draft-mtp
SPEC_DRAFT_N_MAX=3
JINJA=on
REASONING=on
HOST=0.0.0.0
PORT=8082
